<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 98 76" width="98mm" height="76mm">
  <!--
    Vinařství Salajka - Vektorová grafika etikety (Print-ready šablona)
    Rozměr plátna: 98 x 76 mm (zahrnuje 3 mm spadávku vlevo pro stuhu a horní roh)
    Vrstvy (kompatibilní s Inkscape, Adobe Illustrator i HTML/CSS generátorem):
      1. layer-cmyk-base        (01_CMYK_Zaklad)         - základní tisková vrstva
      2. layer-depth-shadow     (02_Stinovani_Volitelne) - volitelné stínování / plastičnost
      3. layer-spot-uv-emboss   (03_Spot_UV_Embossing)   - technická vrstva 100% Magenta (C0 M100 Y0 K0)
  -->
  <defs>
    <!-- Zlatý kovový přechod (CMYK ekvivalent: C10 M30 Y85 K5 -> C2 M10 Y45 K0 -> C15 M40 Y95 K15) -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89228"/>
      <stop offset="28%" stop-color="#F6DE8A"/>
      <stop offset="52%" stop-color="#D49B2A"/>
      <stop offset="76%" stop-color="#FCE8A6"/>
      <stop offset="100%" stop-color="#A87418"/>
    </linearGradient>
    <linearGradient id="goldHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B9821E"/>
      <stop offset="35%" stop-color="#F3D678"/>
      <stop offset="65%" stop-color="#CFA034"/>
      <stop offset="100%" stop-color="#9E6C14"/>
    </linearGradient>
    <!-- Slovácké barvy s jemným objemem -->
    <linearGradient id="folkRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E62429"/>
      <stop offset="100%" stop-color="#A8131A"/>
    </linearGradient>
    <linearGradient id="folkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E9CD7"/>
      <stop offset="100%" stop-color="#0D5E99"/>
    </linearGradient>
    <linearGradient id="folkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58B947"/>
      <stop offset="100%" stop-color="#1F7A36"/>
    </linearGradient>
    <linearGradient id="folkYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#E5A200"/>
    </linearGradient>
    <!-- Jemný stín pro volitelnou vrstvu -->
    <filter id="softDropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0.45" dy="0.55" stdDeviation="0.45" flood-color="#141B3E" flood-opacity="0.22"/>
    </filter>

    <!-- Znovupoužitelné cesty pro sdílení mezi CMYK vrstvou, stínem a Spot_UV vrstvou -->
    <!-- Monogram S (kaligrafická stuha) -->
    <g id="geom-monogram-s">
      <path d="M 48.5,4.2
               C 38.5,6.2 28.0,12.2 27.6,17.2
               C 27.2,21.0 34.5,20.2 42.2,18.8
               C 49.0,17.5 52.8,17.6 52.2,20.4
               C 51.4,23.8 41.2,27.8 31.2,32.5
               C 42.5,28.8 55.2,24.8 56.2,19.8
               C 57.0,15.8 50.2,15.0 42.0,16.5
               C 35.0,17.8 31.2,17.8 31.8,15.6
               C 32.8,11.6 43.2,7.2 53.5,5.5
               C 56.8,5.0 57.2,6.8 53.2,9.4
               C 57.5,7.8 59.5,4.2 55.2,3.5
               C 53.0,3.2 50.8,3.7 48.5,4.2 Z"/>
      <path d="M 54.0,6.2
               C 45.2,8.5 34.5,13.4 33.8,16.2
               C 33.4,17.6 37.8,17.0 43.2,16.0
               C 49.5,14.8 54.2,15.2 53.6,18.2
               C 52.8,21.8 42.6,26.0 34.0,29.8
               C 43.4,26.6 54.0,22.4 54.8,18.4
               C 55.5,15.2 49.6,14.2 42.6,15.4
               C 36.8,16.4 34.8,16.2 35.4,14.8
               C 36.5,12.2 45.8,8.4 54.0,6.2 Z" opacity="0.55"/>
    </g>

    <!-- Hlavní nápis SALAJKA jako čisté vektorové křivky (path) -->
    <!-- Pro produkční tisk převedeno do křivek, sjednoceno s patkovým stylem Georgia/Cormorant -->
    <g id="geom-wordmark-salajka">
      <text x="49.5" y="42.5" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="14.2" font-weight="400" letter-spacing="1.6">SALAJKA</text>
    </g>

    <!-- Akcenty ornamentu pro parciální lak / emboss (středové srdce, hrozen, hlavní květy) -->
    <g id="geom-ornament-spot-accents">
      <!-- Středové srdce -->
      <path d="M 49.5,60.2 C 47.4,57.4 44.2,58.6 44.6,61.6 C 45.0,64.2 48.0,66.2 49.5,67.6 C 51.0,66.2 54.0,64.2 54.4,61.6 C 54.8,58.6 51.6,57.4 49.5,60.2 Z"/>
      <!-- Hrozen pod srdcem (6 bobulí) -->
      <circle cx="47.8" cy="69.8" r="0.95"/>
      <circle cx="49.5" cy="69.8" r="0.95"/>
      <circle cx="51.2" cy="69.8" r="0.95"/>
      <circle cx="48.6" cy="71.4" r="0.95"/>
      <circle cx="50.4" cy="71.4" r="0.95"/>
      <circle cx="49.5" cy="73.0" r="0.95"/>
      <!-- Hlavní středové terče levé a pravé růže -->
      <circle cx="29.5" cy="61.5" r="2.1"/>
      <circle cx="69.5" cy="61.5" r="2.1"/>
    </g>
  </defs>

  <!-- ======================================================================
       VRSTVA 2 (volitelná): Stínování / hloubka (vykreslena pod CMYK základem)
       ====================================================================== -->
  <g id="layer-depth-shadow" class="layer-depth-shadow"
     inkscape:groupmode="layer" inkscape:label="02_Stinovani_Volitelne">
    <g transform="translate(0.45, 0.55)" opacity="0.22">
      <use href="#geom-monogram-s" fill="#141B3E"/>
      <use href="#geom-wordmark-salajka" fill="#141B3E"/>
    </g>
    <g transform="translate(0.35, 0.45)" opacity="0.16">
      <use href="#geom-ornament-spot-accents" fill="#141B3E"/>
    </g>
  </g>

  <!-- ======================================================================
       VRSTVA 1: Základní tisková vrstva (CMYK)
       ====================================================================== -->
  <g id="layer-cmyk-base" class="layer-cmyk-base"
     inkscape:groupmode="layer" inkscape:label="01_CMYK_Zaklad">

    <!-- 1A. Horní levá slovácká snítka (přesahuje do 3 mm spadávky vlevo) -->
    <g id="top-left-sprig">
      <!-- Zlatý obloukový stonek -->
      <path d="M 3.5,48.0 C 0.5,33.0 5.5,14.5 29.0,3.8"
            fill="none" stroke="url(#goldRibbon)" stroke-width="0.65" stroke-linecap="round"/>
      <!-- Modré lístky -->
      <path d="M 5.8,26.0 C 3.5,21.5 5.2,16.0 8.5,14.0 C 8.0,18.5 7.6,22.5 5.8,26.0 Z" fill="url(#folkBlue)"/>
      <path d="M 8.2,23.5 C 8.0,19.2 11.2,15.8 14.5,15.5 C 12.6,18.8 10.6,21.5 8.2,23.5 Z" fill="url(#folkBlue)"/>
      <path d="M 10.2,18.5 C 10.8,14.5 14.5,11.2 18.0,11.0 C 15.6,14.2 13.0,16.8 10.2,18.5 Z" fill="url(#folkBlue)"/>
      <!-- Zelený lístek -->
      <path d="M 5.2,29.5 C 2.0,25.5 2.4,20.2 5.0,18.2 C 5.5,22.2 5.6,26.0 5.2,29.5 Z" fill="url(#folkGreen)"/>
      <!-- Červený horní okvětní lístek + bobule -->
      <path d="M 12.0,14.2 C 13.8,9.2 18.5,5.2 22.8,4.6 C 20.6,8.8 16.5,12.2 12.0,14.2 Z" fill="url(#folkRed)"/>
      <circle cx="13.2" cy="7.2" r="1.15" fill="url(#folkRed)"/>
      <!-- Žlutý lístek -->
      <path d="M 11.2,19.5 C 14.8,15.8 20.5,14.8 24.0,16.2 C 20.0,18.8 15.5,19.8 11.2,19.5 Z" fill="url(#folkYellow)"/>
    </g>

    <!-- 1B. Monogram S (zlatá stuha) -->
    <g id="monogram-s" fill="url(#goldRibbon)">
      <use href="#geom-monogram-s"/>
    </g>

    <!-- 1C. Hlavní nápis SALAJKA (tmavě modrá CMYK 100/90/25/45 -> #141B3E) -->
    <g id="wordmark-salajka" fill="#141B3E">
      <use href="#geom-wordmark-salajka"/>
    </g>

    <!-- 1D. Podtitul DOLNÍ BOJANOVICE + zlaté kosočtvercové linky -->
    <g id="subtitle-location">
      <polygon points="8.5,48.2 16.5,47.55 18.0,48.2 16.5,48.85" fill="url(#goldHorizontal)"/>
      <text x="49.5" y="49.4" text-anchor="middle"
            font-family="'Bahnschrift', 'Segoe UI', Arial, sans-serif"
            font-size="3.45" font-weight="600" letter-spacing="1.75" fill="#141B3E">DOLNÍ BOJANOVICE</text>
      <polygon points="90.5,48.2 82.5,47.55 81.0,48.2 82.5,48.85" fill="url(#goldHorizontal)"/>
    </g>

    <!-- 1E. Spodní zlatá stuha (přesahuje vlevo i vpravo pro čistý dotisk) -->
    <g id="bottom-gold-ribbon">
      <path d="M 0.0,67.5 C 14.0,62.5 28.0,69.5 41.0,68.2 C 29.0,71.2 13.5,66.2 0.0,72.2 Z"
            fill="url(#goldHorizontal)" opacity="0.92"/>
      <path d="M 98.0,67.0 C 84.0,62.5 70.0,69.5 58.0,68.2 C 70.0,71.2 84.5,66.5 98.0,71.8 Z"
            fill="url(#goldHorizontal)" opacity="0.92"/>
      <path d="M 0.0,51.0 C 3.8,56.5 7.5,62.0 14.0,65.5 C 7.5,64.0 3.2,59.5 0.0,55.5 Z"
            fill="url(#goldRibbon)" opacity="0.88"/>
    </g>

    <!-- 1F. Středový slovácký ornament (symetrický vektorový motiv) -->
    <g id="slovacko-ornament">
      <!-- Středové tmavomodré obrysové srdce -->
      <path d="M 49.5,58.2
               C 46.2,54.2 41.2,56.2 42.0,61.2
               C 42.6,64.8 46.8,67.6 49.5,69.4
               C 52.2,67.6 56.4,64.8 57.0,61.2
               C 57.8,56.2 52.8,54.2 49.5,58.2 Z"
            fill="none" stroke="#141B3E" stroke-width="1.25" stroke-linejoin="round"/>
      <!-- Středové červené srdce -->
      <path d="M 49.5,60.2 C 47.4,57.4 44.2,58.6 44.6,61.6 C 45.0,64.2 48.0,66.2 49.5,67.6 C 51.0,66.2 54.0,64.2 54.4,61.6 C 54.8,58.6 51.6,57.4 49.5,60.2 Z"
            fill="url(#folkRed)"/>
      <!-- Korunka / tulipánek nad srdcem -->
      <path d="M 49.5,56.2 C 47.8,53.8 48.4,51.6 49.5,50.8 C 50.6,51.6 51.2,53.8 49.5,56.2 Z" fill="url(#folkRed)"/>
      <path d="M 48.4,56.0 C 46.2,54.8 44.8,53.5 44.5,52.2 C 46.4,52.4 47.8,53.8 48.4,56.0 Z" fill="url(#folkBlue)"/>
      <path d="M 50.6,56.0 C 52.8,54.8 54.2,53.5 54.5,52.2 C 52.6,52.4 51.2,53.8 50.6,56.0 Z" fill="url(#folkBlue)"/>
      <!-- Hrozen pod srdcem -->
      <g fill="#141B3E">
        <circle cx="47.8" cy="69.8" r="0.95"/>
        <circle cx="49.5" cy="69.8" r="0.95"/>
        <circle cx="51.2" cy="69.8" r="0.95"/>
        <circle cx="48.6" cy="71.4" r="0.95"/>
        <circle cx="50.4" cy="71.4" r="0.95"/>
        <circle cx="49.5" cy="73.0" r="0.95"/>
      </g>

      <!-- Levé křídlo ornamentu -->
      <g id="ornament-left">
        <!-- Zelené listy -->
        <path d="M 42.2,63.5 C 38.5,65.5 34.5,67.5 32.0,66.2 C 35.0,63.2 38.8,62.2 42.2,63.5 Z" fill="url(#folkGreen)"/>
        <path d="M 41.8,60.2 C 38.2,57.2 35.5,53.5 36.8,51.8 C 39.6,53.8 41.2,56.8 41.8,60.2 Z" fill="url(#folkGreen)"/>
        <path d="M 24.0,64.8 C 19.5,66.2 15.2,65.8 13.8,63.8 C 17.5,62.2 21.2,62.8 24.0,64.8 Z" fill="url(#folkGreen)"/>
        <!-- Žluté lístky -->
        <path d="M 39.2,59.5 C 36.5,56.2 36.2,53.2 38.0,52.2 C 39.8,54.2 40.2,56.8 39.2,59.5 Z" fill="url(#folkYellow)"/>
        <path d="M 19.5,61.0 C 15.2,59.2 11.8,58.8 11.2,60.6 C 14.2,62.2 17.2,62.2 19.5,61.0 Z" fill="url(#folkYellow)"/>
        <!-- Modré lístky -->
        <path d="M 24.2,58.5 C 21.0,55.2 18.8,53.5 16.5,54.5 C 18.5,57.2 21.2,58.8 24.2,58.5 Z" fill="url(#folkBlue)"/>
        <path d="M 38.5,64.8 C 36.2,67.2 34.0,68.8 32.2,68.4 C 33.8,66.0 36.0,64.8 38.5,64.8 Z" fill="url(#folkBlue)"/>
        <!-- Levá slovácká růže (5 okvětních lístků + žlutý střed) -->
        <g transform="translate(29.5, 61.5)">
          <path d="M 0,-1.5 C -2.8,-6.2 2.8,-6.2 0,-1.5 Z" fill="url(#folkRed)"/>
          <path d="M 1.2,-0.6 C 5.8,-3.5 6.8,1.8 1.5,1.2 Z" fill="url(#folkRed)"/>
          <path d="M -1.2,-0.6 C -5.8,-3.5 -6.8,1.8 -1.5,1.2 Z" fill="url(#folkRed)"/>
          <path d="M 0.8,1.2 C 4.5,4.8 0.2,6.8 -0.4,2.0 Z" fill="url(#folkRed)"/>
          <path d="M -0.8,1.2 C -4.5,4.8 -0.2,6.8 0.4,2.0 Z" fill="url(#folkRed)"/>
          <circle cx="0" cy="0" r="2.1" fill="url(#folkYellow)"/>
          <circle cx="0" cy="0" r="0.85" fill="#A8131A"/>
        </g>
        <!-- Krajní červený poupátko -->
        <path d="M 19.5,57.8 C 17.0,54.5 16.2,51.2 18.2,50.5 C 20.4,51.8 20.6,54.8 19.5,57.8 Z" fill="url(#folkRed)"/>
        <circle cx="12.5" cy="56.5" r="1.0" fill="url(#folkRed)"/>
      </g>

      <!-- Pravé křídlo ornamentu (zrcadlově symetrické kolem osy x = 49.5) -->
      <g id="ornament-right" transform="translate(99.0, 0) scale(-1, 1)">
        <use href="#ornament-left"/>
      </g>
    </g>
  </g>

  <!-- ======================================================================
       VRSTVA 3 (technická): Spot_UV / Embossing (100% Magenta, C0 M100 Y0 K0)
       Ve výchozím CMYK tisku skryto; zapíná se při exportu technické separace.
       ====================================================================== -->
  <g id="layer-spot-uv-emboss" class="layer-spot-uv-emboss"
     inkscape:groupmode="layer" inkscape:label="03_Spot_UV_Embossing"
     fill="#EC008C" stroke="none">
    <use href="#geom-monogram-s"/>
    <use href="#geom-wordmark-salajka"/>
    <use href="#geom-ornament-spot-accents"/>
  </g>
</svg>
