<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-etiketa — Vinařství Salajka</title>
  <style>
    :root {
      --navy: #141B3E;
      --gold: #C89228;
      --gold-soft: #FBF6EA;
      --ink: #1A1A1A;
      --muted: #525866;
      --border: #E5E7EB;
      --bg: #F6F5F1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(20, 27, 62, 0.08);
      overflow: hidden;
      border: 1px solid rgba(200, 146, 40, 0.25);
    }

    .header {
      background: var(--navy);
      color: #FFFFFF;
      padding: 20px 22px 18px;
      text-align: center;
      border-bottom: 3px solid var(--gold);
    }

    .brand {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #E6C163;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .wine-name {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .wine-sub {
      margin-top: 6px;
      font-size: 13.5px;
      color: #E5E7EB;
    }

    .body {
      padding: 20px 22px 22px;
    }

    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .pill {
      background: var(--gold-soft);
      border: 1px solid rgba(200, 146, 40, 0.35);
      color: var(--navy);
      font-size: 12.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }

    h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--navy);
      margin: 18px 0 8px;
      padding-bottom: 5px;
      border-bottom: 1.5px solid var(--gold);
    }

    h2:first-of-type { margin-top: 0; }

    .ingredients {
      font-size: 14.5px;
      margin: 0;
    }

    .allergen-box {
      margin-top: 10px;
      padding: 8px 12px;
      background: #FEF3C7;
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: #78350F;
    }

    table.nutrition {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 4px;
    }

    table.nutrition th,
    table.nutrition td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    table.nutrition th {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 600;
    }

    table.nutrition td:last-child,
    table.nutrition th:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      white-space: nowrap;
    }

    table.nutrition tr.sub td:first-child {
      padding-left: 20px;
      color: var(--muted);
      font-weight: 400;
    }

    table.nutrition tr.sub td:last-child {
      font-weight: 400;
    }

    .note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .producer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      display: grid;
      gap: 2px;
    }

    .producer strong { color: var(--ink); }

    .lang-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #E5E7EB;
      border: 1px solid rgba(230, 193, 99, 0.35);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--gold);
      color: #141B3E;
      border-color: var(--gold);
    }

    .empty-state {
      text-align: center;
      padding: 20px 8px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card" id="app">
    <header class="header">
      <div class="lang-bar" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="cs">CZ</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="de">DE</button>
      </div>
      <div class="brand" id="t_brand">Vinařství Salajka • Elektronická etiketa</div>
      <h1 class="wine-name" id="v_nazev">Víno</h1>
      <div class="wine-sub" id="v_zatrid"></div>
    </header>

    <div class="body" id="content">
      <div class="meta-pills" id="v_pills"></div>

      <h2 id="t_h_ingredients">Složení</h2>
      <p class="ingredients" id="v_slozeni"></p>
      <div class="allergen-box" id="v_alergeny"></div>

      <h2 id="t_h_nutrition">Výživové údaje (na 100 ml)</h2>
      <table class="nutrition" aria-label="Výživové údaje na 100 ml">
        <thead>
          <tr>
            <th id="t_th_name">Výživová hodnota</th>
            <th id="t_th_val">ve 100 ml</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="t_energy">Energetická hodnota</td>
            <td id="v_energie"></td>
          </tr>
          <tr>
            <td id="t_fat">Tuky</td>
            <td id="v_tuky"></td>
          </tr>
          <tr class="sub">
            <td id="t_sat">z toho nasycené mastné kyseliny</td>
            <td id="v_nasycene"></td>
          </tr>
          <tr>
            <td id="t_carbs">Sacharidy</td>
            <td id="v_sacharidy"></td>
          </tr>
          <tr class="sub">
            <td id="t_sugars">z toho cukry</td>
            <td id="v_cukry"></td>
          </tr>
          <tr>
            <td id="t_protein">Bílkoviny</td>
            <td id="v_bilkoviny"></td>
          </tr>
          <tr>
            <td id="t_salt">Sůl</td>
            <td id="v_sul"></td>
          </tr>
        </tbody>
      </table>

      <p class="note" id="v_note"></p>

      <footer class="producer">
        <div><strong id="t_bottled">Plněno v:</strong> Vojtěch Salajka</div>
        <div id="t_village">Obec Dolní Bojanovice • IČ: 01129813</div>
        <div id="v_trat_row"></div>
        <div id="t_origin">Víno z České republiky</div>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      const I18N = {
        cs: {
          brand: 'Vinařství Salajka • Elektronická etiketa',
          vintage: 'Ročník',
          lot: 'č.š.:',
          alc: 'Alk.:',
          h_ingredients: 'Složení',
          h_nutrition: 'Výživové údaje (na 100 ml)',
          th_name: 'Výživová hodnota',
          th_val: 've 100 ml',
          energy: 'Energetická hodnota',
          fat: 'Tuky',
          sat: 'z toho nasycené mastné kyseliny',
          carbs: 'Sacharidy',
          sugars: 'z toho cukry',
          protein: 'Bílkoviny',
          salt: 'Sůl',
          note_negligible: 'Obsahuje zanedbatelné množství tuků, nasycených mastných kyselin, bílkovin a soli.',
          bottled: 'Plněno v:',
          village: 'Obec Dolní Bojanovice • IČ: 01129813',
          vineyard: 'Viniční trať',
          origin: 'Víno z České republiky',
          def_ingredients: 'hrozny, konzervanty a antioxidanty (oxid siřičitý)',
          def_allergens: 'Obsahuje oxid siřičitý'
        },
        en: {
          brand: 'Vinařství Salajka • Electronic Label',
          vintage: 'Vintage',
          lot: 'Lot:',
          alc: 'Alc.:',
          h_ingredients: 'Ingredients',
          h_nutrition: 'Nutrition Declaration (per 100 ml)',
          th_name: 'Nutrition information',
          th_val: 'per 100 ml',
          energy: 'Energy',
          fat: 'Fat',
          sat: 'of which saturates',
          carbs: 'Carbohydrate',
          sugars: 'of which sugars',
          protein: 'Protein',
          salt: 'Salt',
          note_negligible: 'Contains negligible amounts of fat, saturates, protein and salt.',
          bottled: 'Bottled by:',
          village: 'Dolní Bojanovice • ID: 01129813',
          vineyard: 'Vineyard',
          origin: 'Wine of the Czech Republic',
          def_ingredients: 'grapes, preservatives and antioxidants (sulphur dioxide)',
          def_allergens: 'Contains sulphites'
        },
        de: {
          brand: 'Vinařství Salajka • Elektronisches Etikett',
          vintage: 'Jahrgang',
          lot: 'Los:',
          alc: 'Alk.:',
          h_ingredients: 'Zutaten',
          h_nutrition: 'Nährwertdeklaration (je 100 ml)',
          th_name: 'Nährwertangaben',
          th_val: 'je 100 ml',
          energy: 'Brennwert',
          fat: 'Fett',
          sat: 'davon gesättigte Fettsäuren',
          carbs: 'Kohlenhydrate',
          sugars: 'davon Zucker',
          protein: 'Eiweiß',
          salt: 'Salz',
          note_negligible: 'Enthält geringfügige Mengen von Fett, gesättigten Fettsäuren, Eiweiß und Salz.',
          bottled: 'Abgefüllt von:',
          village: 'Dolní Bojanovice • ID: 01129813',
          vineyard: 'Weinberg',
          origin: 'Wein aus der Tschechischen Republik',
          def_ingredients: 'Trauben, Konservierungsstoffe und Antioxidationsmittel (Schwefeldioxid)',
          def_allergens: 'Enthält Sulfite'
        }
      };

      const p = new URLSearchParams(window.location.search);
      const get = (key, fallback = '') => (p.get(key) || fallback).trim();

      const nazev = get('n', 'Víno — Vinařství Salajka');
      const rocnik = get('r');
      const zatrid = get('z');
      const trat = get('t');
      const sarze = get('s');
      const energie = get('e', '—').replace(/\s*ve\s*100\s*ml/i, '');
      const alkohol = get('a');
      const objem = get('o');
      const rawSlozeni = get('sl');
      const rawAlergeny = get('al');
      const tuky = get('tu', '0 g');
      const nasycene = get('nm', '0 g');
      const sacharidy = get('sa', '—');
      const cukry = get('cu', '—');
      const bilkoviny = get('bi', '0 g');
      const sul = get('su', '0 g');

      const escapeHtml = (str) => str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const highlightAllergens = (str) => escapeHtml(str).replace(
        /(oxid\s+siřičitý|siřičitany|siřičitan[a-záčďéěíňóřšťúůýž]*|sulphur\s+dioxide|sulphites|sulfites|schwefeldioxid|sulfite|vaječ[a-záčďéěíňóřšťúůýž]*|mléč[a-záčďéěíňóřšťúůýž]*|kasein|lysozym|albumin)/gi,
        '<strong>$1</strong>'
      );

      const isZero = (v) => /^0([,\.]0+)?\s*g$/i.test(v);

      function renderLang(lang) {
        const t = I18N[lang] || I18N.cs;
        document.documentElement.lang = lang;
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        document.title = `${nazev}${rocnik ? ' ' + rocnik : ''} — E-etiketa | Vinařství Salajka`;
        document.getElementById('t_brand').textContent = t.brand;
        document.getElementById('v_nazev').textContent = nazev;
        document.getElementById('v_zatrid').textContent = [zatrid, rocnik ? `${t.vintage} ${rocnik}` : ''].filter(Boolean).join(' • ');

        const pillsEl = document.getElementById('v_pills');
        pillsEl.innerHTML = '';
        const pills = [];
        if (rocnik) pills.push(`${t.vintage} ${rocnik}`);
        if (sarze) pills.push(`${t.lot} ${sarze}`);
        if (alkohol) pills.push(`${t.alc} ${alkohol}`);
        if (objem) pills.push(objem);
        pills.forEach((txt) => {
          const span = document.createElement('span');
          span.className = 'pill';
          span.textContent = txt;
          pillsEl.appendChild(span);
        });

        document.getElementById('t_h_ingredients').textContent = t.h_ingredients;
        document.getElementById('t_h_nutrition').textContent = t.h_nutrition;
        document.getElementById('t_th_name').textContent = t.th_name;
        document.getElementById('t_th_val').textContent = t.th_val;
        document.getElementById('t_energy').textContent = t.energy;
        document.getElementById('t_fat').textContent = t.fat;
        document.getElementById('t_sat').textContent = t.sat;
        document.getElementById('t_carbs').textContent = t.carbs;
        document.getElementById('t_sugars').textContent = t.sugars;
        document.getElementById('t_protein').textContent = t.protein;
        document.getElementById('t_salt').textContent = t.salt;
        document.getElementById('t_bottled').textContent = t.bottled;
        document.getElementById('t_village').textContent = t.village;
        document.getElementById('t_origin').textContent = t.origin;

        const slozeni = rawSlozeni || t.def_ingredients;
        const alergeny = rawAlergeny || t.def_allergens;
        document.getElementById('v_slozeni').innerHTML = highlightAllergens(slozeni);

        const alEl = document.getElementById('v_alergeny');
        alEl.textContent = alergeny;
        alEl.style.display = alergeny ? '' : 'none';

        document.getElementById('v_energie').textContent = energie;
        document.getElementById('v_tuky').textContent = tuky;
        document.getElementById('v_nasycene').textContent = nasycene;
        document.getElementById('v_sacharidy').textContent = sacharidy;
        document.getElementById('v_cukry').textContent = cukry;
        document.getElementById('v_bilkoviny').textContent = bilkoviny;
        document.getElementById('v_sul').textContent = sul;

        const noteEl = document.getElementById('v_note');
        if (isZero(tuky) && isZero(nasycene) && isZero(bilkoviny) && isZero(sul)) {
          noteEl.textContent = t.note_negligible;
          noteEl.style.display = '';
        } else {
          noteEl.style.display = 'none';
        }

        const tratRow = document.getElementById('v_trat_row');
        if (trat) {
          tratRow.textContent = `${t.vineyard} ${trat}`;
          tratRow.style.display = '';
        } else {
          tratRow.style.display = 'none';
        }
      }

      document.querySelectorAll('.lang-btn').forEach((btn) => {
        btn.addEventListener('click', () => renderLang(btn.dataset.lang));
      });

      const navLang = (navigator.language || 'cs').slice(0, 2).toLowerCase();
      renderLang(I18N[navLang] ? navLang : 'cs');
    })();
  </script>
</body>
</html>
